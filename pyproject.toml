[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ruralroute-gtfs"
version = "0.1.0"
description = "Auditable, offline GTFS return-journey feasibility checks for transport gaps"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "RuralRoute contributors"}]
keywords = ["gtfs", "public-transport", "rural", "accessibility", "transit", "timetable"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.scripts]
ruralroute = "ruralroute.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
