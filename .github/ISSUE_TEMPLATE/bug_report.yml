name: Bug report
about: Describe an incorrect return-feasibility result
labels: [bug]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual results
      description: Explain the time windows, stop IDs and why the result is wrong.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Prefer a small synthetic GTFS feed. Do not upload private travel data.
    validations:
      required: true
