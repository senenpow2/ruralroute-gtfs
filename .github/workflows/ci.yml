name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e . pytest ruff
      - name: Lint
        run: ruff check src tests
      - name: Run tests
        run: python -m pytest -q
      - name: CLI smoke test
        run: ruralroute check --feed examples/synthetic-wales --date 2026-11-04 --from HOME --to HOSP --return-after 16:00 --format json
